<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Input + Picker Template</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#101828; --ink-soft:#475467; --ink-muted:#98A2B3;
    --border:#E4E7EC; --border-strong:#D0D5DD;
    --field-bg:#FBFBFC;
    --accent:#1D4E89; --accent-dark:#163D6D; --accent-tint:#EAF1FB;
    --danger:#D92D20;
    --radius-field:7px; --radius-card:14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:#EEF1F5; }
  body{ display:flex; align-items:center; justify-content:center; padding:24px; }

  .demo-card{
    background:#fff; border:1px solid var(--border); border-radius:var(--radius-card);
    padding:28px 30px; width:100%; max-width:420px;
    box-shadow:0 8px 30px rgba(16,24,40,0.10);
  }
  .demo-card h1{ font-size:15px; margin:0 0 4px; font-weight:700; }
  .demo-card > p{ margin:0 0 22px; font-size:12.5px; color:var(--ink-soft); }

  .field{ position:relative; margin-bottom:20px; }
  .field label{
    font-size:13px; font-weight:500; color:var(--ink); margin-bottom:6px;
    display:flex; align-items:center; gap:6px;
  }
  .req{ color:var(--danger); font-size:12px; }

  .date-input-wrap{ position:relative; }

  .date-input-wrap input{
    width:100%; font-family:inherit; font-size:14px; letter-spacing:.5px;
    color:var(--ink); background:var(--field-bg);
    border:1px solid var(--border-strong); border-radius:var(--radius-field);
    padding:9px 40px 9px 11px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .date-input-wrap input.filled{ color:var(--ink); }
  .date-input-wrap input:focus{
    border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px var(--accent-tint);
  }

  .calendar-toggle{
    position:absolute; right:5px; top:50%; transform:translateY(-50%);
    width:30px; height:30px; border-radius:6px; border:none; background:transparent;
    color:var(--ink-muted); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s ease, color .15s ease;
  }
  .calendar-toggle:hover{ background:var(--accent-tint); color:var(--accent); }
  .calendar-toggle svg{ width:17px; height:17px; }

  .hint{ font-size:11.5px; color:var(--ink-muted); margin-top:5px; }

  /* ---------- Calendar popup ---------- */
  .calendar-popup{
    position:absolute; top:calc(100% + 6px); left:0;
    width:290px; background:#fff; border:1px solid var(--border);
    border-radius:12px; box-shadow:0 12px 34px rgba(16,24,40,0.18);
    padding:14px; z-index:20;
    display:none;
  }
  .calendar-popup.open{ display:block; }

  .cal-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .cal-nav{
    width:28px; height:28px; border-radius:6px; border:1px solid var(--border);
    background:#fff; color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .cal-nav:hover{ background:var(--accent-tint); color:var(--accent); border-color:#D5E3F7; }
  .cal-nav svg{ width:14px; height:14px; }

  .cal-selects{ display:flex; gap:6px; flex:1; }
  .cal-selects select{
    font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink);
    border:1px solid var(--border-strong); border-radius:6px; padding:5px 6px;
    background:#fff; outline:none; flex:1; min-width:0;
  }
  .cal-selects select:focus{ border-color:var(--accent); }

  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
  .cal-weekdays span{
    text-align:center; font-size:10.5px; font-weight:600; color:var(--ink-muted); padding:4px 0;
  }

  .cal-days{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-day{
    aspect-ratio:1; border:none; background:none; border-radius:7px;
    font-family:inherit; font-size:12.5px; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .cal-day:hover{ background:var(--accent-tint); color:var(--accent); }
  .cal-day.muted{ color:var(--ink-muted); }
  .cal-day.today{ font-weight:700; color:var(--accent); }
  .cal-day.selected{ background:var(--accent); color:#fff; }
  .cal-day.selected:hover{ background:var(--accent-dark); color:#fff; }

  .cal-foot{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:12px; padding-top:11px; border-top:1px solid var(--border);
  }
  .cal-link{
    background:none; border:none; font-family:inherit; font-size:12px; font-weight:600;
    color:var(--accent); cursor:pointer; padding:2px 0;
  }
  .cal-link:hover{ text-decoration:underline; }
  .cal-link.muted{ color:var(--ink-muted); }
</style>
</head>
<body>

<div class="demo-card">
  <h1>Template: Ô Nhập Ngày Tháng</h1>
  <p>Gõ số trực tiếp (tự nhảy ô, hiện dd/mm/yyyy khi chưa đủ) hoặc bấm icon lịch để chọn.</p>

  <div class="field">
    <label>Ngày Sinh <span class="req">*</span></label>
    <div class="date-input-wrap">
      <input type="text" id="dateInput" inputmode="numeric" autocomplete="off" value="dd/mm/yyyy">
      <button type="button" class="calendar-toggle" id="calToggle" aria-label="Chọn ngày">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="16" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M8 3v4M16 3v4M3.5 10h17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>

      <div class="calendar-popup" id="calPopup">
        <div class="cal-head">
          <button type="button" class="cal-nav" id="prevMonth"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <div class="cal-selects">
            <select id="monthSelect"></select>
            <select id="yearSelect"></select>
          </div>
          <button type="button" class="cal-nav" id="nextMonth"><svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="cal-weekdays">
          <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
        </div>
        <div class="cal-days" id="calDays"></div>
        <div class="cal-foot">
          <button type="button" class="cal-link" id="todayBtn">Hôm nay</button>
          <button type="button" class="cal-link muted" id="clearBtn">Xóa</button>
        </div>
      </div>
    </div>
    <div class="hint">Định dạng dd/mm/yyyy — có thể gõ tay hoặc chọn bằng lịch.</div>
  </div>
</div>

<script>
/* ---------- Masked date input ---------- */
class DateMaskInput{
  constructor(input){
    this.input = input;
    this.digits = [null,null,null,null,null,null,null,null]; // d d m m y y y y
    this.slotForCharIndex = [0,1,null,2,3,null,4,5,6,7];
    this.charIndexForSlot = [0,1,3,4,6,7,8,9];
    this.activeSlot = 0;
    this.onChange = null;
    this.render();
    this.bind();
  }
  placeholderChar(slot){ return slot<2 ? 'd' : (slot<4 ? 'm' : 'y'); }
  render(){
    const d = this.digits;
    const c = i => d[i] !== null ? d[i] : this.placeholderChar(i);
    this.input.value = `${c(0)}${c(1)}/${c(2)}${c(3)}/${c(4)}${c(5)}${c(6)}${c(7)}`;
    this.input.classList.toggle('filled', d.some(x=>x!==null));
    if(this.onChange) this.onChange(this.getDate());
  }
  setCursor(i){ requestAnimationFrame(()=> this.input.setSelectionRange(i,i)); }
  focusSlot(slot){
    this.activeSlot = Math.max(0, Math.min(7, slot));
    this.setCursor(this.charIndexForSlot[this.activeSlot]);
  }
  bind(){
    this.input.addEventListener('keydown', e=>{
      if(e.key>='0' && e.key<='9'){
        e.preventDefault();
        this.digits[this.activeSlot] = e.key;
        const wasLast = this.activeSlot === 7;
        this.render();
        if(!wasLast){ this.activeSlot++; this.setCursor(this.charIndexForSlot[this.activeSlot]); }
        else this.setCursor(10);
      } else if(e.key === 'Backspace'){
        e.preventDefault();
        if(this.digits[this.activeSlot] !== null){ this.digits[this.activeSlot] = null; }
        else if(this.activeSlot > 0){ this.activeSlot--; this.digits[this.activeSlot] = null; }
        this.render();
        this.setCursor(this.charIndexForSlot[this.activeSlot]);
      } else if(e.key === 'Delete'){
        e.preventDefault();
        this.digits[this.activeSlot] = null;
        this.render();
        this.setCursor(this.charIndexForSlot[this.activeSlot]);
      } else if(e.key === 'ArrowLeft'){ e.preventDefault(); this.focusSlot(this.activeSlot-1); }
      else if(e.key === 'ArrowRight'){ e.preventDefault(); this.focusSlot(this.activeSlot+1); }
      else if(e.key === 'Tab'){ /* allow default */ }
      else if(e.key.length === 1){ e.preventDefault(); }
    });
    this.input.addEventListener('click', ()=>{
      const pos = this.input.selectionStart ?? 0;
      let slot = this.slotForCharIndex[Math.min(pos,9)];
      if(slot === null || slot === undefined){
        for(let i=Math.min(pos,9); i>=0; i--){ if(this.slotForCharIndex[i] !== null){ slot = this.slotForCharIndex[i]; break; } }
        slot = slot ?? 0;
      }
      this.focusSlot(slot);
    });
    this.input.addEventListener('focus', ()=>{ if(this.activeSlot === 0) this.setCursor(this.charIndexForSlot[0]); });
  }
  setDate(day, month, year){
    this.digits = [
      String(Math.floor(day/10)), String(day%10),
      String(Math.floor(month/10)), String(month%10),
      ...String(year).padStart(4,'0').split('')
    ];
    this.activeSlot = 7;
    this.render();
  }
  clear(){ this.digits = [null,null,null,null,null,null,null,null]; this.activeSlot = 0; this.render(); }
  getDate(){
    if(this.digits.some(d=>d===null)) return null;
    return {
      day: parseInt(this.digits[0]+this.digits[1]),
      month: parseInt(this.digits[2]+this.digits[3]),
      year: parseInt(this.digits.slice(4).join(''))
    };
  }
}

/* ---------- Calendar popup ---------- */
const mask = new DateMaskInput(document.getElementById('dateInput'));
const popup = document.getElementById('calPopup');
const monthSelect = document.getElementById('monthSelect');
const yearSelect = document.getElementById('yearSelect');
const calDays = document.getElementById('calDays');

const today = new Date();
let viewMonth = today.getMonth();
let viewYear = today.getFullYear();
let selected = null;

const monthNames = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
monthNames.forEach((m,i)=>{
  const o = document.createElement('option'); o.value=i; o.textContent=m; monthSelect.appendChild(o);
});
const yStart = today.getFullYear() - 100, yEnd = today.getFullYear() + 10;
for(let y=yEnd; y>=yStart; y--){
  const o = document.createElement('option'); o.value=y; o.textContent=y; yearSelect.appendChild(o);
}

function renderCalendar(){
  monthSelect.value = viewMonth;
  yearSelect.value = viewYear;
  calDays.innerHTML = '';

  const firstDay = new Date(viewYear, viewMonth, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();

  for(let i=0; i<startOffset; i++){
    const btn = document.createElement('button');
    btn.type='button'; btn.className='cal-day muted';
    btn.textContent = daysInPrevMonth - startOffset + i + 1;
    btn.disabled = true;
    calDays.appendChild(btn);
  }
  for(let d=1; d<=daysInMonth; d++){
    const btn = document.createElement('button');
    btn.type='button'; btn.className='cal-day';
    btn.textContent = d;
    const isToday = d===today.getDate() && viewMonth===today.getMonth() && viewYear===today.getFullYear();
    const isSelected = selected && selected.day===d && selected.month===viewMonth+1 && selected.year===viewYear;
    if(isToday) btn.classList.add('today');
    if(isSelected) btn.classList.add('selected');
    btn.addEventListener('click', ()=>{
      selected = {day:d, month:viewMonth+1, year:viewYear};
      mask.setDate(d, viewMonth+1, viewYear);
      renderCalendar();
      closePopup();
    });
    calDays.appendChild(btn);
  }
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=1; i<=trailing; i++){
    const btn = document.createElement('button');
    btn.type='button'; btn.className='cal-day muted'; btn.textContent=i; btn.disabled=true;
    calDays.appendChild(btn);
  }
}

function openPopup(){ popup.classList.add('open'); renderCalendar(); }
function closePopup(){ popup.classList.remove('open'); }

document.getElementById('calToggle').addEventListener('click', (e)=>{
  e.stopPropagation();
  popup.classList.contains('open') ? closePopup() : openPopup();
});
document.getElementById('prevMonth').addEventListener('click', ()=>{
  viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; } renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', ()=>{
  viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; } renderCalendar();
});
monthSelect.addEventListener('change', ()=>{ viewMonth = parseInt(monthSelect.value); renderCalendar(); });
yearSelect.addEventListener('change', ()=>{ viewYear = parseInt(yearSelect.value); renderCalendar(); });
document.getElementById('todayBtn').addEventListener('click', ()=>{
  viewMonth = today.getMonth(); viewYear = today.getFullYear();
  selected = {day:today.getDate(), month:today.getMonth()+1, year:today.getFullYear()};
  mask.setDate(selected.day, selected.month, selected.year);
  renderCalendar(); closePopup();
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  selected = null; mask.clear(); closePopup();
});
document.addEventListener('click', (e)=>{
  if(!popup.contains(e.target) && e.target.id !== 'calToggle') closePopup();
});
</script>

</body>
</html>
