<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Phong tro</title>
        <!-- reset css -->
        <link rel="stylesheet" href="./assets/css/reset.css" />

        <!-- style css -->
        <link rel="stylesheet" href="./assets/css/style.css" />
        <!-- file js -->
    </head>
    <body>
        <div class="page">
            <div class="header">
                <p class="title">PHIẾU THU TIỀN NHÀ&nbsp;&nbsp;đt: <span id="f-dienThoai"></span></p>
                <p class="room">Phòng số: <span id="f-phong"></span></p>
            </div>

            <p class="date" id="f-ngay"></p>

            <div class="content">
                <div class="row">
                    <span>Tiền phòng:</span>
                    <span class="row-fill"></span>
                    <span>=</span>
                    <span class="row-value"><span id="f-tienPhong"></span><sup>đ</sup></span>
                </div>

                <div class="row">
                    <span>Tiền điện:&nbsp; Số mới:</span>
                    <span class="row-fill short"></span>
                    <span class="meter-value" id="f-dienMoi"></span>
                    <span class="row-fill short"></span>
                    <span>Số cũ:</span>
                    <span class="row-fill short"></span>
                    <span class="meter-value" id="f-dienCu"></span>
                    <span class="row-fill"></span>
                </div>
                <div class="row calc-row">
                    <span class="row-fill long"></span>
                    <span class="size-gap1">=</span>
                    <span class="row-value" id="f-dienKwh"></span>
                    <span class="size-gap2">x</span>
                    <span class="row-value"><span id="f-giaDien"></span><sup>đ</sup></span>
                    <span class="row-fill"></span>
                    <span>=</span>
                    <span class="row-value"><span id="f-tienDien"></span><sup>đ</sup></span>
                </div>

                <div class="row">
                    <span>Tiền nước:&nbsp; Số mới:</span>
                    <span class="row-fill short"></span>
                    <span class="meter-value" id="f-nuocMoi"></span>
                    <span class="row-fill short"></span>
                    <span>Số cũ:</span>
                    <span class="row-fill short"></span>
                    <span class="meter-value" id="f-nuocCu"></span>
                    <span class="row-fill"></span>
                </div>
                <div class="row calc-row">
                    <span class="row-fill long"></span>
                    <span class="size-gap1">=</span>
                    <span class="row-value" id="f-nuocKhoi"></span>
                    <span class="size-gap2">x</span>
                    <span class="row-value"><span id="f-giaNuoc"></span><sup>đ</sup></span>
                    <span class="row-fill"></span>
                    <span>=</span>
                    <span class="row-value"><span id="f-tienNuoc"></span><sup>đ</sup></span>
                </div>

                <div class="row">
                    <span>Tiền rác:</span>
                    <span class="row-fill"></span>
                    <span>=</span>
                    <span class="row-value"><span id="f-rac"></span><sup>đ</sup></span>
                </div>

                <div class="row">
                    <span>Internet:</span>
                    <span class="row-fill"></span>
                    <span>=</span>
                    <span class="row-value"><span id="f-internet"></span><sup>đ</sup></span>
                </div>

                <div class="row">
                    <span>Tiền điện hao tải:</span>
                    <span class="row-fill short"></span>
                    <span class="size-gap1">=</span>
                    <span class="row-value" id="f-haoTaiKwh"></span>
                    <span class="size-gap2">x</span>
                    <span class="row-value"><span id="f-giaHaoTai"></span><sup>đ</sup></span>
                    <span class="row-fill"></span>
                    <span>=</span>
                    <span class="row-value"><span id="f-tienHaoTai"></span><sup>đ</sup></span>
                </div>

                <div class="row" id="row-noCu" style="display: none">
                    <span>Nợ cũ:</span>
                    <span class="row-fill"></span>
                    <span>=</span>
                    <span class="row-fill short"></span>
                    <span class="row-value"><span id="f-noCu"></span><sup>đ</sup></span>
                </div>

                <div class="row total-row">
                    <span>Tổng cộng:</span>
                    <span class="row-fill"></span>
                    <span class="total-box"><span id="f-tongCong"></span><sup class="unit">đ</sup></span>
                </div>
            </div>
        </div>

        <!-- main.js đặt cuối body: lúc chạy thì mọi thẻ ở trên đã tồn tại -->
        <script src="main.js"></script>
    </body>
</html>
